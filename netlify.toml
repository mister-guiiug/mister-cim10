# mister-cim10 est déployé via GitHub Pages (cf. .github/workflows/deploy.yml,
# reusable pwa-deploy.yml). Le site Netlify « mister-cim10-dev » est redondant
# et son build échoue de toute façon (pas de NODE_AUTH_TOKEN pour installer
# @mister-guiiug/* depuis GitHub Packages).
#
# On NEUTRALISE Netlify côté dépôt : la commande `ignore` sort 0, ce qui dit à
# Netlify de SAUTER le build (build skippé) — donc plus d'install, plus d'échec
# d'auth, plus de « deploy preview » rouge sur les PR.
#
# Suppression DÉFINITIVE = côté dashboard Netlify : délier le dépôt du site
# « mister-cim10-dev » (ou supprimer le site), ou retirer mister-cim10 des dépôts
# autorisés de l'app GitHub « Netlify ». Ce fichier devient alors inutile.
[build]
  ignore = "exit 0"
