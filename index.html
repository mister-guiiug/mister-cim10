<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy en défense en profondeur.

      'unsafe-inline' : le script anti-FOUC injecté au build par pwaSeoPlugin
      (theme-boot) et les styles JIT de Tailwind 4 / vite-plugin-pwa.

      PLUS AUCUN EXTRAIT DE MESURE N'EST INJECTÉ AU BUILD. Les marqueurs
      `__ANALYTICS_*__` ont été retirés du parc en septembre 2026 : le tag de
      Google n'est chargé qu'APRÈS un accord explicite, par `ConsentBanner`.
      `www.googletagmanager.com` reste autorisé parce que c'est de là que GA4
      se sert — mais rien n'en part avant le consentement. GTM, lui, n'est plus
      utilisé (cf. l'ADR 0011 du squelette).

      Tiers : Google Fonts (styles et polices) et GA4.
      connect-src *.who.int : API OMS optionnelle (recherche ICD).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.who.int; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Thème : script anti-FOUC et <meta name="theme-color"> (deux balises
         par schéma, attribut media) injectés au build par pwaSeoPlugin
         (themeBoot/themeColor) ; le choix explicite contraire au système est
         resynchronisé par ThemeProvider. -->
    <meta
      name="description"
      content="Analyse de comptes-rendus et suggestions de codes CIM-10 avec validation et export."
    />
    <link rel="canonical" href="__SEO_HOME_URL__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mister CIM10" />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta property="og:title" content="Mister CIM10" />
    <meta
      property="og:description"
      content="Analyse de comptes-rendus et suggestions de codes CIM-10 avec validation et export."
    />
    <meta property="og:image" content="__SEO_LOGO_URL__" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mister CIM10" />
    <meta
      name="twitter:description"
      content="Aide à la cotation CIM-10 : analyse locale, export, option OMS."
    />
    <meta name="twitter:image" content="__SEO_LOGO_URL__" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="%BASE_URL%icon-96.png"
      sizes="96x96"
      type="image/png"
    />
    <link
      rel="icon"
      href="%BASE_URL%icon-192.png"
      sizes="192x192"
      type="image/png"
    />
    <!--
      UNE SEULE ICÔNE APPLE, ET C'EST LA SEULE QUI SOIT OPAQUE.

      Il y en avait cinq : celle-ci, plus `icon-192/256/384/512` déclarées en
      `apple-touch-icon` avec leur taille. Ces quatre-là sont les icônes
      `purpose: any` du manifeste, et elles portent des COINS TRANSPARENTS —
      mesuré, alpha 0. iOS n'accepte pas la transparence : il la comble
      lui-même, historiquement par du noir. Il choisit d'ailleurs la taille
      déclarée la plus proche de celle qu'il veut (180 sur un iPhone récent),
      donc il prenait volontiers la 192 : un cadre sombre autour de la tuile.

      `apple-touch-icon.png` fait 180 px, sort de `icon-maskable.svg` et n'a pas
      un pixel transparent. C'est tout ce dont iOS a besoin.
    -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Mister CIM10</title>
  </head>
  <body>
    <a href="#main-content" class="skip-to-content">Aller au contenu</a>
    <div id="react-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
