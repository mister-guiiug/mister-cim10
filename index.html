<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy en défense en profondeur.
      'unsafe-inline' : script anti-FOUC + snippets GTM/GA4 injectés au build,
      styles Tailwind/vite-plugin-pwa. Tiers : Google Fonts + GTM/GA4.
      connect-src *.who.int : API OMS optionnelle (recherche ICD).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.who.int; frame-src https://www.googletagmanager.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Thème : script anti-FOUC et <meta name="theme-color"> (deux balises
         par schéma, attribut media) injectés au build par pwaSeoPlugin
         (themeBoot/themeColor) ; le choix explicite contraire au système est
         resynchronisé par ThemeProvider. -->
    <meta
      name="description"
      content="Analyse de comptes-rendus et suggestions de codes CIM-10 avec validation et export."
    />
    <link rel="canonical" href="__SEO_HOME_URL__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mister CIM-10" />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta property="og:title" content="Mister CIM-10" />
    <meta
      property="og:description"
      content="Analyse de comptes-rendus et suggestions de codes CIM-10 avec validation et export."
    />
    <meta property="og:image" content="__SEO_LOGO_URL__" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mister CIM-10" />
    <meta
      name="twitter:description"
      content="Aide à la cotation CIM-10 : analyse locale, export, option OMS."
    />
    <meta name="twitter:image" content="__SEO_LOGO_URL__" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="%BASE_URL%favicon-96.png"
      sizes="96x96"
      type="image/png"
    />
    <link
      rel="icon"
      href="%BASE_URL%icon-192.png"
      sizes="192x192"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="%BASE_URL%icon-192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="256x256"
      href="%BASE_URL%icon-256.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="384x384"
      href="%BASE_URL%icon-384.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="%BASE_URL%icon-512.png"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Mister CIM-10</title>
  </head>
  <body>
    <a href="#main-content" class="skip-to-content">Aller au contenu</a>
    <div id="react-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
