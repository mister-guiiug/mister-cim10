<!doctype html>

    <meta charset="UTF-8" />
    <!--
      LA CSP EST POSÉE AU BUILD PAR `cspPlugin` (vite.config.ts), plus ici.
      Elle vivait dans ce fichier, recopiée à la main : le 19/09/2026 le socle
      a ouvert `connect-src` à l’hôte du DSN Sentry pour tout le parc, et cette
      app ne l’a pas reçu — aucune montée de paquet n’atteint une chaîne de
      caractères. Sur une app qui reçoit du texte clinique, c’était la
      remontée d’erreurs entière qui partait dans le vide.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Thème : script anti-FOUC et <meta name="theme-color"> (deux balises
         par schéma, attribut media) injectés au build par pwaSeoPlugin
         (themeBoot/themeColor) ; le choix explicite contraire au système est
         resynchronisé par ThemeProvider. -->
    <meta
      name="description"
      content="Analyse de comptes-rendus et suggestions de codes CIM-10 avec validation et export."
    />
    <link rel="canonical" href="__SEO_HOME_URL__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mister CIM10" />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta
      property="og:title"
      content="Mister CIM10 - aide au codage CIM-10 dans le navigateur"
    />
    <meta
      property="og:description"
      content="Analyse de comptes-rendus et suggestions de codes CIM-10 avec validation et export."
    />
    <meta property="og:image" content="__SEO_LOGO_URL__" />
    <meta property="og:locale" content="fr_FR" />

      rel="stylesheet"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="%BASE_URL%icon-96.png"
      sizes="96x96"
      type="image/png"
    />
    <link
      rel="icon"
      href="%BASE_URL%icon-192.png"
      sizes="192x192"
      type="image/png"
    />
    <!--
      UNE SEULE ICÔNE APPLE, ET C'EST LA SEULE QUI SOIT OPAQUE.

      Il y en avait cinq : celle-ci, plus `icon-192/256/384/512` déclarées en
      `apple-touch-icon` avec leur taille. Ces quatre-là sont les icônes
      `purpose: any` du manifeste, et elles portent des COINS TRANSPARENTS —
      mesuré, alpha 0. iOS n'accepte pas la transparence : il la comble
      lui-même, historiquement par du noir. Il choisit d'ailleurs la taille
      déclarée la plus proche de celle qu'il veut (180 sur un iPhone récent),
      donc il prenait volontiers la 192 : un cadre sombre autour de la tuile.

      `apple-touch-icon.png` fait 180 px, sort de `icon-maskable.svg` et n'a pas
      un pixel transparent. C'est tout ce dont iOS a besoin.
    -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Mister CIM10 - aide au codage CIM-10 dans le navigateur</title>
  </head>
