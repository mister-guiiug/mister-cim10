# Deploy délégué au reusable workflow famille (dev-pwa-config).
# Les permissions doivent être déclarées au niveau caller : le reusable workflow
# ne peut pas élever celles du caller (intersection only).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  deploy:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-deploy.yml@v6
    # PAS de `secrets: inherit` : le seul secret déclaré par
    # `pwa-deploy.yml` est `FIREBASE_SERVICE_ACCOUNT_KEY`, et ce dépôt ne
    # déploie pas sur Firebase. Hériter enverrait TOUS les secrets du dépôt
    # à un workflow qui n'en attend aucun ici.
    with:
      use-base-path: true
      # LE SEUL INTERRUPTEUR DE LA MESURE D'AUDIENCE, ET IL EST ICI.
      #
      # `pwa-deploy.yml` n'injecte QUE ce que l'appelant lui donne : sans
      # cette ligne, poser la variable de dépôt ne change rien au build et le
      # bandeau de consentement ne rend rien, faute d'identifiant. Relevé le
      # 15/09/2026 : zéro dépôt sur vingt la passait.
      #
      # Variable absente = chaîne vide = aucune mesure. Elle n'active donc
      # rien par elle-même : elle rend la variable capable d'agir.
      #
      # La passerelle OMS suit la même règle, pour la même raison : ces trois
      # valeurs sont PUBLIQUES (l'adresse figure dans chaque requête du
      # navigateur), donc `vars`. Le compte OMS, lui, n'apparaît nulle part
      # ici : il vit en secrets SUR LA PASSERELLE, et c'est
      # `deploy-worker.yml` qui l'y porte.
      build-env: |
        VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
        VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
        VITE_WHO_PROXY_URL=${{ vars.VITE_WHO_PROXY_URL }}
        VITE_WHO_RELEASE_ID=${{ vars.VITE_WHO_RELEASE_ID }}
        VITE_WHO_LANG=${{ vars.VITE_WHO_LANG }}
